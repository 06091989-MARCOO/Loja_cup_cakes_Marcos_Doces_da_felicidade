<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>🧁 Marcos doces da felicidade - Login & Loja</title>
    <style>
        /* Mudança de fundo para um tom azul claro suave e letras em azul escuro */
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f0f7ff; color: #1e293b; }
        h1, h2 { color: #0284c7; text-align: center; }
        
        /* Janela de Login em Tons Azuis */
        .login-container { background: white; max-width: 350px; margin: 80px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; text-align: center; }
        .login-container input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1em; }
        .login-container button { background-color: #0284c7; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 96%; font-size: 1.1em; }
        .login-container button:hover { background-color: #0369a1; }
        .error-msg { color: #ef4444; font-size: 0.9em; margin-top: 10px; display: none; }

        /* Área da Loja */
        #area-loja { display: none; }
        
        .welcome-banner { 
            background-image: url('https://unsplash.com');
            background-size: cover; background-position: center; height: 200px; border-radius: 15px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 30px; border: 2px solid #e2e8f0; position: relative;
        }
        /* Sombreamento em azul escuro para dar destaque ao letreiro branco */
        .welcome-banner h1 { color: #fff; text-shadow: 2px 2px 8px rgba(2, 132, 199, 0.9); font-size: 2.8em; margin: 0; }
        .welcome-banner p { color: #fff; text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.8); font-size: 1.2em; font-weight: bold; margin-top: 5px; }
        .logout-btn { position: absolute; top: 15px; right: 15px; background-color: #64748b; font-size: 0.8em; padding: 5px 12px; width: auto; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .logout-btn:hover { background-color: #475569; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
        .cupcake-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .preco { font-weight: bold; color: #0284c7; font-size: 1.2em; }
        
        /* Botões de Adicionar em tom azul royal suave */
        .card button { background-color: #38bdf8; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; width: 100%; }
        .card button:hover { background-color: #0284c7; }
        
        .carrinho { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .btn-fim { background-color: #10b981; margin-top: 15px; padding: 10px; font-size: 1em; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-fim:hover { background-color: #059669; }
    </style>
</head>
<body>

    <!-- 1. CAIXA DE LOGIN -->
    <div id="tela-login" class="login-container">
        <h2>🧁 Marcos doces da felicidade</h2>
        <p style="color: #64748b; font-size: 0.9em; margin-bottom: 15px;">Faça login para entrar na confeitaria</p>
        <input type="text" id="usuario" placeholder="Usuário (admin)">
        <input type="password" id="senha" placeholder="Senha (1234)">
        <button onclick="realizarLogin()">Entrar</button>
        <div id="erro-login" class="error-msg">Usuário ou senha incorretos!</div>
    </div>

    <!-- 2. INTERFACE DA LOJA -->
    <div id="area-loja">
        <div class="welcome-banner">
            <button class="logout-btn" onclick="fazerLogout()">Sair</button>
            <h1 id="boas-vinda-texto">Marcos doces da felicidade</h1>
            <p>Feitos com amor para adoçar o seu dia! 🧁</p>
        </div>
        
        <h2>Nossos Sabores Especiais</h2>
        <div class="grid" id="vitrine"></div>

        <div class="carrinho">
            <h2>Seu Carrinho</h2>
            <ul id="lista-carrinho"></ul>
            <button class="btn-fim" onclick="finalizarPedido()">Finalizar Compra</button>
        </div>
    </div>

    <script>
        async function realizarLogin() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('senha').value;
            const erroDiv = document.getElementById('erro-login');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: user, senha: pass })
            });

            const dados = await res.json();

            if (res.ok) {
                erroDiv.style.display = 'none';
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('area-loja').style.display = 'block';
                document.getElementById('boas-vinda-texto').innerText = `Marcos doces da felicidade`;
                carregarCupcakes();
                verCarrinho();
            } else {
                erroDiv.innerText = dados.erro;
                erroDiv.style.display = 'block';
            }
        }

        function fazerLogout() {
            document.getElementById('usuario').value = "";
            document.getElementById('senha').value = "";
            document.getElementById('area-loja').style.display = 'none';
            document.getElementById('tela-login').style.display = 'block';
        }

        async function carregarCupcakes() {
            const res = await fetch('/api/cupcakes');
            const cupcakes = await res.json();
            let html = '';
            for(let c of cupcakes) {
                html += `
                    <div class="card">
                        <img class="cupcake-img" src="${c.imagem}" alt="${c.nome}">
                        <h3>${c.nome}</h3>
                        <p><em>${c.sabor}</em></p>
                        <p>${c.descricao}</p>
                        <p class="preco">R$ ${c.preco.toFixed(2)}</p>
                        <button onclick="add(${c.id})">Adicionar</button>
                    </div>
                `;
            }
            document.getElementById('vitrine').innerHTML = html;
        }

        async function add(id) {
            await fetch('/api/carrinho', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cupcake_id: id, quantidade: 1})
            });
            verCarrinho();
        }

        async function verCarrinho() {
            const res = await fetch('/api/carrinho');
            const itens = await res.json();
            const lista = document.getElementById('lista-carrinho');
            if(itens.length === 0) { lista.innerHTML = '<li>Carrinho vazio</li>'; return; }
            let html = '';
            for(let i of itens) {
                html += `<li><span>${i.cupcake.nome} (x${i.quantidade})</span><span>R$ ${(i.cupcake.preco * i.quantidade).toFixed(2)}</span></li>`;
            }
            lista.innerHTML = html;
        }

        async function finalizarPedido() {
            const res = await fetch('/api/checkout', {method: 'POST'});
            const d = await res.json();
            if (res.ok) { alert(d.mensagem + '\nTotal: R\$ ' + d.total.toFixed(2)); verCarrinho(); }
            else { alert(d.erro); }
        }
    </script>
</body>
</html>
